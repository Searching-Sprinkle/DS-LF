exp:
  expname: teeth
  expdir: ./logs//nerf/
  datadir: ./data/weiguihua_50.pickle
network:
  net_type: mlp
  num_layers: 8
  hidden_dim: 256
  skips: [4]
  out_dim: 1
  last_activation: relu
  bound: 0.31
encoder:
  encoding: frequency
  multires: 6
render:
  n_samples: 192    # 第一次在每一条射线上采样点的数量，粗采样
  n_fine: 192         # 第二次采样点，细采样，此处设置成0，表示不细采样
  perturb: True
  raw_noise_std: 0.
  netchunk: 409600  # NeRF模型每一次处理点的个数, batchsize of points
train:
  epoch: 1500
  n_batch: 1
  n_rays: 1024
  lrate: 0.001
  lrate_gamma: 0.1
  lrate_step: 1500
  resume: False
log:
  i_eval: 250  # Epoch for evaluation
  i_save: 500  # Epoch for saving
